#:schema ../../../../../schema/opc-object-type.schema.json

name = "MotorType"
description = "Represents a production line motor"

[[variable]]
name = "Speed"
description = "Motor speed in rpm"
data_type = "Double"
access_level = "Write"

[[variable]]
name = "IsRunning"
description = "True if the motor is currently engaged"
data_type = "Boolean"
access_level = "Read"

[[variable]]
name = "AlarmCodes"
description = "Active alarm codes"
data_type = "Int32"
access_level = "ReadWrite"
array_dimensions = [10]
